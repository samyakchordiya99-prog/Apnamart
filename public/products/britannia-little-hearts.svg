<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHearts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="packGradHearts" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="goldGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadowHearts" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="32" fill="url(#bgGradHearts)" />
  <circle cx="250" cy="240" r="180" fill="#ffffff" opacity="0.75" />

  <!-- Category Badge Pill -->
  <g transform="translate(250, 42)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#ffffff" filter="url(#shadowHearts)" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#be123c" letter-spacing="1">BISCUITS &amp; BAKERY</text>
  </g>

  <!-- Main Product Container (Pouch) -->
  <g filter="url(#shadowHearts)">
    <!-- Standup Red Hearts Pouch -->
    <path d="M 120 115 C 140 95, 360 95, 380 115 L 395 385 C 395 405, 105 405, 105 385 Z" fill="url(#packGradHearts)" />
    <line x1="120" y1="130" x2="380" y2="130" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4,4" />
    <rect x="190" y="110" width="120" height="6" rx="3" fill="#fbbf24" opacity="0.6" />

    <!-- Product Branding Label Area -->
    <g transform="translate(250, 245)">
      <rect x="-115" y="-105" width="230" height="215" rx="18" fill="#ffffff" opacity="0.96" filter="url(#shadowHearts)" />
      
      <!-- Brand Name -->
      <text x="0" y="-72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#e11d48" letter-spacing="2">BRITANNIA</text>
      
      <!-- Little Hearts Logo -->
      <rect x="-85" y="-62" width="170" height="36" rx="18" fill="#e11d48" />
      <text x="0" y="-38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1">LITTLE HEARTS</text>

      <!-- Center Glazed Heart Biscuits Graphics -->
      <g transform="translate(0, 10)">
        <!-- Heart 1 Left -->
        <g transform="translate(-25, 4) scale(0.9) rotate(-15)">
          <path d="M 0 10 A 12 12 0 0 0 -22 -4 A 12 12 0 0 0 -22 16 L 0 35 L 22 16 A 12 12 0 0 0 22 -4 A 12 12 0 0 0 0 10 Z" fill="url(#goldGlaze)" stroke="#b45309" stroke-width="2" />
          <circle cx="-10" cy="5" r="1.5" fill="#ffffff" />
          <circle cx="8" cy="8" r="1.5" fill="#ffffff" />
          <circle cx="0" cy="20" r="1.5" fill="#ffffff" />
        </g>
        <!-- Heart 2 Right/Main -->
        <g transform="translate(18, -2) scale(1.05) rotate(12)">
          <path d="M 0 10 A 12 12 0 0 0 -22 -4 A 12 12 0 0 0 -22 16 L 0 35 L 22 16 A 12 12 0 0 0 22 -4 A 12 12 0 0 0 0 10 Z" fill="url(#goldGlaze)" stroke="#b45309" stroke-width="2" />
          <circle cx="-8" cy="7" r="2" fill="#ffffff" />
          <circle cx="10" cy="9" r="1.5" fill="#ffffff" />
          <circle cx="-2" cy="18" r="2" fill="#ffffff" />
          <circle cx="6" cy="22" r="1.5" fill="#ffffff" />
        </g>
      </g>

      <!-- Flavor subtitle -->
      <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Classic Sugar Glazed</text>
      <text x="0" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#e11d48">Sweet &amp; Crisp Puff Biscuits</text>

      <!-- Weight badge -->
      <g transform="translate(0, 92)">
        <rect x="-40" y="-10" width="80" height="18" rx="9" fill="#fef2f2" />
        <text x="0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#991b1b">75 g Net</text>
      </g>
    </g>

    <!-- Veg Green Icon -->
    <g transform="translate(355, 140)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
      <circle cx="10" cy="10" r="5" fill="#16a34a" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)" />
  <circle cx="250" cy="240" r="180" fill="#ffffff" opacity="0.65" />

  <!-- Top Category Badge Pill -->
  <g transform="translate(250, 42)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0369a1" letter-spacing="1">BISCUITS &amp; BAKERY</text>
  </g>

  <!-- Main Product Container (Pouch) -->
  <g filter="url(#shadow)">
    <!-- Pouch Body -->
    <path d="M 120 120 Q 250 110 380 120 L 360 400 Q 250 415 140 400 Z" fill="url(#packGrad)" />
    <!-- Gloss highlight -->
    <path d="M 130 130 Q 250 120 370 130 L 365 170 Q 250 155 135 170 Z" fill="#ffffff" opacity="0.2" />

    <!-- Product Branding Label Area -->
    <g transform="translate(250, 245)">
      <rect x="-115" y="-95" width="230" height="195" rx="16" fill="#ffffff" opacity="0.96" filter="url(#shadow)" />
      
      <!-- Brand Name -->
      <text x="0" y="-62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#0369a1" letter-spacing="1.5">CADBURY</text>
      
      <!-- Oreo Sandwich Cookie Graphic -->
      <g transform="translate(0, -8)">
        <!-- Back Cookie -->
        <ellipse cx="0" cy="5" rx="36" ry="14" fill="#171717" />
        <!-- White Vanilla Creme Layer -->
        <ellipse cx="0" cy="1" rx="36" ry="12" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
        <!-- Front Embossed Cocoa Cookie -->
        <ellipse cx="0" cy="-6" rx="36" ry="14" fill="url(#cookieGrad)" stroke="#404040" stroke-width="1.5" />
        <ellipse cx="0" cy="-6" rx="26" ry="9" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="3,2" />
        <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="900" fill="#737373" letter-spacing="1">OREO</text>
      </g>
      
      <!-- Product Title -->
      <text x="0" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0284c7">OREO ORIGINAL</text>
      <text x="0" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1">Vanilla Creme Sandwich</text>
      <text x="0" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">🥛 Twist, Lick, Dunk 🍪</text>
    </g>

    <!-- Weight & Veg Badge -->
    <g transform="translate(250, 428)">
      <rect x="-65" y="-14" width="130" height="26" rx="13" fill="#0369a1" />
      <circle cx="-45" cy="-1" r="5" fill="#22c55e" />
      <text x="5" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">NET WT: 120g</text>
    </g>
  </g>
</svg>